plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.kzzkaiii.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.kzzkaiii.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
    }
}

// The APK gets the exact launcher files from the repository. Large Unity game
// builds are intentionally downloaded/cached at runtime instead of committed.
tasks.register("syncKzzKaiiiSite", Copy) {
    from("$rootDir/../telechargement")
    into("$projectDir/src/main/assets/site")
}

tasks.register("syncKzzKaiiiPython", Copy) {
    from("$rootDir/../serve_localhost.py")
    from("$rootDir/../activation_locale.py")
    into("$projectDir/src/main/python")
}

tasks.named("preBuild").configure {
    dependsOn("syncKzzKaiiiSite", "syncKzzKaiiiPython")
}
